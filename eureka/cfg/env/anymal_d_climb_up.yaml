# description: "The task is to have a quadruped robot track a command velocity when climbing increasingly taller step heights. The task score is from 0 to 1, with 1 being that all robots in the simulation can climb up stairs beyond a certain step height. 
#   Some tips when designing a reward function are:
#   - The reward function can be decomposed into several reward terms. The primary term should be command velocity tracking. Secondary terms CAN (not SHOULD) be to reward feet air contact, penalize energy consumption, penalize motions when standing still, penalize huge foot contacts, penalize collisions, reward stability, etc... Be careful with optimizing the secondary terms, as they can harm task performance.
#   - Rewarding feet air contacts can potentially help the robot reproduce higher and longer foot strides.
#   - Encourage a stable duty factor and stride frequency only when the main task is good enough (ideally > 0.75). 
#   - To determine if a foot is in contact with the ground, compute self.contact_forces[:, self.feet_indices, 2] > 1.
#   - To determine feet contact forces, compute torch.norm(self.contact_forces[:, self.feet_indices, :], dim=-1)
#   - To determine energy consumption, compute self.torques dot product with self.dof_vel or self.torques*self.torques,
#   The shape of self.contact_forces is (num_envs, 4, 3). 4 for 4 feet and 3 for XYZ axis (since we did not define any states like self.foot_contacts, self.measured_forces, self.foot_contact_forces, or self.energy_consumption)"
description: "The task is to have a quadruped robot track a command velocity when climbing increasingly taller step heights. The task score is from 0 to 1, with 1 being that all robots in the simulation can climb up stairs beyond a certain step height."
