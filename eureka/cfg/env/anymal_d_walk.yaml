# description: The primary goal of the policy is to enable the quadruped robot to accurately track randomly chosen x, y, and yaw velocity commands on flat and slightly uneven terrain (and ONLY this type of terrain).
#   In addition to precise velocity tracking, the policy should optimize several secondary objectives crucial for real-world deployment, such as
#   - Smooth and controlled footstep swings that are biomechanically reasonable.
#   - Energy efficiency to extend runtime.
#   - Low-impact foot contacts to minimize stress on the robot's structure.
#   - Stability against small external disturbances to enhance robustness.
#   - No movements for 0 velocity commands.
#   While these secondary objectives may sometimes conflict, the policy should strike a balance to ensure safe, efficient, and reliable locomotion on real hardware.
#   Some additional tips when designing a reward function are
#   - To determine if a foot is in contact with the ground, compute self.contact_forces[:, self.feet_indices, 2] > 1.
#   - To determine feet contact forces, compute torch.norm(self.contact_forces[:, self.feet_indices, :], dim=-1)
#   - To determine energy consumption, compute self.torques dot product with self.dof_vel or self.torques*self.torques,
#   The shape of self.contact_forces is (num_envs, 4, 3). 4 for 4 feet and 3 for XYZ axis.
#   Since we did not define any states like self.foot_contacts, self.measured_forces, self.foot_contact_forces, or self.energy_consumption
description: 
  "The primary goal of the policy is to enable the quadruped robot to accurately track randomly chosen x, y, and yaw velocity commands on flat and slightly uneven terrain only.
  In addition to precise velocity tracking, the policy should optimize several secondary objectives, such as:
  - No movements for 0 velocity commands. Very important.
  - Stability against small external disturbances to enhance robustness.
  - Smooth and controlled footstep swings that are biomechanically reasonable.
  - Energy efficiency to extend runtime.
  - Low-impact foot contacts to minimize stress on the robot's structure.
  While these secondary objectives may sometimes conflict, the policy should strike a balance to ensure safe, efficient, and reliable locomotion.
  As inspiration, here is a human-designed reward function that works well for a locomotion policy on general purpose terrain:
  ```python
  @torch.jit.script
  def compute_reward(
      base_lin_vel: torch.Tensor,
      base_ang_vel: torch.Tensor,
      commands: torch.Tensor,
      projected_gravity: torch.Tensor,
      root_states: torch.Tensor,
      torques: torch.Tensor,
      dof_vel: torch.Tensor,
      last_dof_vel: torch.Tensor,
      contact_forces: torch.Tensor,
      feet_indices: torch.Tensor,
      knee_indices: torch.Tensor,
      last_actions: torch.Tensor,
      actions: torch.Tensor,
      feet_air_time: torch.Tensor,
      default_dof_pos: torch.Tensor,
      dof_pos: torch.Tensor,
      dt: float
  ) -> Tuple[torch.Tensor, Dict[str, torch.Tensor]]:

      # Velocity tracking rewards (separate terms)
      lin_vel_error = torch.sum(torch.square(commands[:, :2] - base_lin_vel[:, :2]), dim=1)
      lin_vel_tracking_reward = torch.exp(-lin_vel_error / 0.25)

      ang_vel_error = torch.square(commands[:, 2] - base_ang_vel[:, 2])
      ang_vel_tracking_reward = torch.exp(-ang_vel_error / 0.25)

      # Other velocity penalties
      lin_vel_z_penalty = torch.square(base_lin_vel[:, 2])
      ang_vel_xy_penalty = torch.sum(torch.square(base_ang_vel[:, :2]), dim=1)

      # Orientation penalty
      orientation_penalty = torch.sum(torch.square(projected_gravity[:, :2]), dim=1)

      # Base height penalty
      base_height_penalty = torch.square(root_states[:, 2] - 0.5)

      # Energy-related penalties
      torque_penalty = torch.sum(torch.square(torques), dim=1)
      joint_acc_penalty = torch.sum(torch.square(last_dof_vel - dof_vel) / dt, dim=1)

      # Collision and stumbling penalties
      knee_contact = torch.norm(contact_forces[:, knee_indices, :], dim=2) > 1.0
      collision_penalty = torch.sum(knee_contact, dim=1)

      stumble = (torch.norm(contact_forces[:, feet_indices, :2], dim=2) > 5.) * (torch.abs(contact_forces[:, feet_indices, 2]) < 1.)
      stumble_penalty = torch.sum(stumble, dim=1)

      # Action rate penalty
      action_rate_penalty = torch.sum(torch.square(last_actions - actions), dim=1)

      # Feet air time reward
      contact = contact_forces[:, feet_indices, 2] > 1.0
      first_contact = (feet_air_time > 0.) * contact
      feet_air_time_reward = torch.sum((feet_air_time - 0.5) * first_contact, dim=1)
      feet_air_time_reward *= torch.norm(commands[:, :2], dim=1) > 0.1  # No reward for zero command
      feet_air_time *= ~contact

      # Stand still at 0 velocity reward
      stand_still_reward = torch.sum(torch.abs(self.dof_pos - self.default_dof_pos), dim=1) * (torch.norm(self.commands[:, :2], dim=1) < 0.1)

      # Penalize high contact forces
      torch.sum((torch.norm(self.contact_forces[:, self.feet_indices, :], dim=-1) - 500).clip(min=0.), dim=1)

      # Balanced total reward composition
      total_reward = (
          lin_vel_tracking_reward * 1.0 +  # Prioritizing linear velocity tracking
          ang_vel_tracking_reward * 0.5 +  # Less emphasis on angular tracking
          feet_air_time_reward * 1.0 +  # Encourages keeping feet in the air
          collision_penalty * -0.5 +  # Penalizes knee collisions
          action_rate_penalty * -0.01 +  # Penalizes sudden changes in action
          torque_penalty * -0.00001 +  # Penalizes high torque usage
          joint_acc_penalty * -2.5e-7  # Penalizes excessive joint acceleration
      )

      # Reward components dictionary
      reward_components = {
          \"lin_vel_tracking\": lin_vel_tracking_reward,
          \"ang_vel_tracking\": ang_vel_tracking_reward,
          \"feet_air_time_reward\": feet_air_time_reward,
          \"collision_penalty\": collision_penalty,
          \"action_rate_penalty\": action_rate_penalty,
          \"torque_penalty\": torque_penalty,
          \"joint_acc_penalty\": joint_acc_penalty,
      }

      return total_reward, reward_components
    ```
  Some suggestions when modifying the reward function feet_air_time are:
  (a) Changing its scale or adding a temperature parameter
  (b) Re-writing a reward component inside the function
  (c) Discarding a reward component inside the function
